# Every hour: read every repository on the list, its .pspdx, its release and
# the EBOOT in it, and publish the catalog, the pictures and the page. What
# is already published is the only memory this repository keeps: apps whose
# release has not moved are taken from it rather than read again. The site
# is published every hour all the same, so its generated_at stamp is the time
# of the last successful look and a console can tell a list nobody looks
# after from one that had no news. A catalog that breaks the published schema
# is not deployed at all: the site that is up stays up and the run goes red.
name: Deploy

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never two racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        # The format lives in the `pspdx` submodule: the schema the reader
        # validates against, and the tests read, comes with the checkout,
        # pinned to the commit this repository records, never the moving
        # published one.
        with:
          submodules: true

      # look.py reads the vendored schema and holds every .pspdx to it, so it
      # needs jsonschema too; the tests and the final check share this one
      # environment.
      - name: Install the schema checker
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt

      - name: Test catalog processing
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s page -t page -p 'test_*.py' -v

      - name: Read the repositories on the list
        id: look
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # An hourly run trusts the published catalog and skips the apps
          # whose release has not moved. A push or a run started by hand is
          # a change to the list or the code, which no release announces, so
          # those read everything again and deploy whatever comes out.
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" page/look.py

      # Before anything is uploaded, so a catalog consoles cannot trust
      # never replaces one they can.
      - name: Check the catalog against the schema
        if: steps.look.outputs.changed == 'yes'
        run: |
          "$RUNNER_TEMP/venv/bin/python" page/check_schema.py site/catalog.json

      - uses: actions/configure-pages@v6
        if: steps.look.outputs.changed == 'yes'
      - uses: actions/upload-pages-artifact@v5
        if: steps.look.outputs.changed == 'yes'
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
        if: steps.look.outputs.changed == 'yes'

      # Last, so that a repository nobody can list still leaves the rest of
      # the catalog on the site: the run goes red, the page stays current,
      # and the reason is in the log and at the bottom of the page.
      - name: Fail if anything was left out
        if: steps.look.outputs.left_out != '0'
        run: |
          echo "${{ steps.look.outputs.left_out }} repositories were left out; see the log above"
          exit 1
