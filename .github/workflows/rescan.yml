name: Rescan on request

# An author with no access here can still ask for their release to be picked
# up: open an issue titled "rescan: <repository url>". Anyone may open one, so
# it is only acted on for repositories that are already listed -- a rescan of
# something unknown is a request to be added, and a person reads that.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  rescan:
    if: startsWith(github.event.issue.title, 'rescan:')
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.rescan.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Rescan
        id: rescan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          url="$(echo "$TITLE" | sed -E 's/^rescan:[[:space:]]*//' | tr -d ' ')"
          if ! grep -rqiF "\"$url\"" apps/*/app.json; then
            gh issue comment "$NUMBER" --body "\`$url\` is not listed here yet, so this is not a rescan but a request to be added. Leaving it open for a person to read."
            exit 0
          fi
          python3 scan.py "$url" 2>&1 | tee scan.log
          git config user.name "pspdx-scan"
          git config user.email "pspdx-scan@users.noreply.github.com"
          git add apps
          if git diff --cached --quiet; then
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUMBER" --body "Already current -- nothing changed."
          else
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
            git commit -m "Refresh $url, asked for in #$NUMBER"
            git push
            gh issue comment "$NUMBER" --body "$(printf 'Picked up.\n\n```\n%s\n```' "$(tail -20 scan.log)")"
          fi
          gh issue close "$NUMBER"

  deploy:
    needs: rescan
    if: needs.rescan.outputs.pushed == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
