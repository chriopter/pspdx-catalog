name: Build catalog

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Called by hourly-scan.yml: a push it makes with GITHUB_TOKEN starts nothing on
  # its own, so the deploy has to be asked for explicitly.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already running; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The tip of master, not the commit that triggered this run: when the
      # scan calls this workflow it has just pushed, and the triggering SHA is
      # the tree from before its own commit.
      - uses: actions/checkout@v4
        with:
          ref: master


      - uses: actions/configure-pages@v5

      - name: Generate site
        run: |
          mkdir -p _site
          python3 build.py _site/catalog.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
