name: Triggered scan

# An author with no access here can still ask for their release to be picked
# up: open an issue titled "rescan: <repository url>". Anyone may open one, so
# it is only acted on for repositories that are already listed -- a rescan of
# something unknown is a request to be added, and a person reads that.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  rescan:
    if: startsWith(github.event.issue.title, 'rescan:')
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.rescan.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Rescan
        id: rescan
        # bash, so that the pipe into tee cannot swallow a failure: without it
        # a scan that refused to publish was reported as "already current".
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -o pipefail
          url="$(printf '%s' "$TITLE" | sed -E 's/^[Rr]escan:[[:space:]]*//' \
                 | tr -d '[:space:]')"
          if [ -z "$url" ]; then
            gh issue comment "$NUMBER" --body "Nothing after \`rescan:\` — the title needs the repository URL, like \`rescan: https://github.com/user/repo\`."
            exit 0
          fi

          # scan.py answers this, normalising the URL the same way it does
          # everywhere else. A grep over app.json matched any field: an issue
          # titled "rescan: MIT" got through on a licence.
          if ! python3 scan.py --listed "$url"; then
            gh issue comment "$NUMBER" --body "\`$url\` is not listed here yet, so this is a request to be added rather than a rescan. Leaving it open for a person to read."
            exit 0
          fi

          set +e
          python3 scan.py "$url" 2>&1 | tee scan.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            gh issue comment "$NUMBER" --body "$(printf 'The scan refused this release, so the catalog still points at the last one that worked.\n\n```\n%s\n```\n\n[the run](%s)' "$(tail -20 scan.log)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          git config user.name "pspdx-scan"
          git config user.email "pspdx-scan@users.noreply.github.com"
          git add apps/*/latest.json
          if git diff --cached --quiet; then
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUMBER" --body "Already the newest release — nothing changed."
          else
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
            git commit -m "Refresh $url, asked for in #$NUMBER"
            git push
            gh issue comment "$NUMBER" --body "$(printf 'Picked up.\n\n```\n%s\n```' "$(tail -20 scan.log)")"
          fi
          gh issue close "$NUMBER"

  deploy:
    needs: rescan
    if: needs.rescan.outputs.pushed == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-catalog.yml
