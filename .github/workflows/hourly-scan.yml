name: Hourly scan

on:
  schedule:
    # Hourly, because a 304 from GitHub costs nothing against the rate limit
    # and nobody wants to wait until tomorrow to see their release listed.
    - cron: "17 * * * *"
    # Weekly, and this one leaves a commit even when nothing changed: GitHub
    # switches scheduled workflows off after 60 days without repository
    # activity, and a quiet index would switch itself off.
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository URL to scan. Empty scans every entry."
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        id: scan
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Through the environment, never interpolated into the script: a
          # dispatch input reaching bash unquoted is a command, not a value.
          REPO: ${{ inputs.repo }}
        run: |
          set +e
          python3 scan.py "${REPO:---all}" 2>&1 | tee scan.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Heartbeat
        if: github.event.schedule == '23 6 * * 1'
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .scanned

      - name: Commit
        id: commit
        shell: bash
        run: |
          git config user.name "pspdx-scan"
          git config user.email "pspdx-scan@users.noreply.github.com"
          # Only latest.json. app.json is a person's, and no workflow of
          # ours is going to be the thing that quietly rewrites a summary.
          git add apps/*/latest.json
          if [ -f .scanned ]; then git add .scanned; fi
          if git diff --cached --quiet; then
            echo "nothing changed"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          git commit -m "Refresh ${{ steps.scan.outputs.changed || 'the catalog' }}" \
                     -m "Written by scan.py: rev, url, sha256 and size come from the
          release GitHub served and the bytes it actually sent. rev only moves
          when those bytes do."
          git push

      # An upstream that moved its package is not something to paper over: the
      # entry keeps the release that installs, and a person gets told.
      - name: Report what needs a person
        if: steps.scan.outputs.code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(printf 'A release could not be taken over unchanged, so those packages still point at the last one that worked.\n\n```\n%s\n```\n\n[the run](%s)' \
                  "$(tail -40 scan.log)" \
                  "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          # One open issue, not one per hour.
          open="$(gh issue list --state open --label scan --limit 1 --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create scan --color ededed --description "Raised by the scan" 2>/dev/null || true
            gh issue create --title "The scan needs a person" --label scan --body "$body"
          fi
          exit 1
