name: Check an entry

# Nothing used to look at a pull request. A missing field or a repository with
# no release only showed up as a red deploy after the merge, by which point
# the catalog had stopped updating for everybody.
on:
  pull_request:
    paths: ["apps/**", "build.py", "scan.py"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalog
        run: python3 build.py /tmp/site/catalog.json

      - name: Check the entries this pull request touches
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          changed="$(git diff --name-only "$BASE"...HEAD -- 'apps/*/app.json')"
          if [ -z "$changed" ]; then echo "no entries touched"; exit 0; fi
          for f in $changed; do
            [ -f "$f" ] || continue          # deleted entries need no check
            repo="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['repo'])" "$f")"
            echo "== $(basename "$(dirname "$f")")  $repo"
            python3 scan.py --check "$repo"
          done
